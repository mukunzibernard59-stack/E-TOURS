<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-tour | Explore the world in 360°</title>
    <link rel="shortcut icon" href="logo2.jpg" type="image/x-icon">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;height:100vh;display:flex;flex-direction:column}
  #header{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:1px solid #fff;gap:12px;flex-wrap:wrap}
  #websiteName{color:rgb(0,14,173);font-weight:800;font-size:clamp(1.6rem,4vw,2.6rem);text-decoration:none}
  #controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  select,input,button{padding:10px 12px;border-radius:5px;border:1px solid #fff;background:#111;color:#fff;font-weight:700}
  button{background:rgb(49,49,238);cursor:pointer}
  button.ghost{background:transparent}
  button.me{padding:6px 12px;font-size:13px;background:#0a8f3c;border-radius:20px}
  button:hover{opacity:.85}
  #main{flex:1;display:flex;min-height:0}
  #sidebar{width:280px;border-right:1px solid #fff;overflow-y:auto;padding:10px}
  #sidebar h3{margin:6px 0 10px;border-left:3px solid rgb(112,0,0);padding-left:8px}
  #sidebar h4{margin:12px 0 6px;font-size:13px;color:#aaa;text-transform:uppercase;letter-spacing:.5px}
  #searchRow{display:flex;gap:6px;margin-bottom:6px}
  #search{flex:1;min-width:0}
  #goBtn{padding:10px 12px}
  #hint{font-size:12px;color:#999;margin-bottom:8px}
  .country{padding:8px;border-radius:5px;cursor:pointer;font-size:14px}
  .country:hover,.country.active{background:rgba(128,128,128,.6)}
  .place{padding:8px;border-radius:5px;cursor:pointer;font-size:13px;border-left:3px solid #0a8f3c;margin-bottom:4px;background:#111}
  .place:hover{background:rgba(128,128,128,.6)}
  #views{flex:1;display:flex;flex-direction:column;min-width:0}
  #pano{flex:3;min-height:0}
  #map{flex:1;min-height:150px;border-top:1px solid #fff}
  #status{padding:6px 12px;font-size:13px;color:#ccc;border-top:1px solid #333}
  @media(max-width:768px){#main{flex-direction:column}#sidebar{width:100%;height:190px;border-right:none;border-bottom:1px solid #fff}}
</style>
</head>
<body>
<div id="header">
  <a id="websiteName" href="menu.html">E-TOUR</a>
  <div id="controls">
    <button id="meBtn" class="me" title="Show my exact location in Street View"> Me</button>
    <button id="randomBtn"> Random place</button>
    <button id="nextBtn" class="ghost">Next spot in country </button>
  </div>
</div>
<div id="main">
  <div id="sidebar">
    <h3>Countries</h3>
    <div id="searchRow">
      <input id="search" placeholder="Country">
      <button id="goBtn" title="Search place">search</button>
    </div>
    
    <div id="placeBox"></div>
    <h4>Countries</h4>
    <div id="list"></div>
  </div>
  <div id="views">
    <div id="pano"></div>
    <div id="map"></div>
    <div id="status">Pick a country,  or press “Me” to start your 360° tour. Drag to look around, click arrows to walk.</div>
  </div>
</div>
<script>
// ========= PUT YOUR GOOGLE MAPS API KEY HERE =========
// Enable "Maps JavaScript API" AND "Geocoding API" in Google Cloud Console for this key.
const API_KEY = "AIzaSyAVsM1TDf3uVt-DqI_dztH007X1DZJtW3E";
// =====================================================
// Countries with Street View coverage: [name, lat, lng, spread in degrees]
const COUNTRIES = [
 ["Rwanda",-1.95,30.06,0.6],["Kenya",-1.29,36.82,2],["Uganda",0.35,32.58,1],["Tanzania",-6.8,39.28,2],
 ["South Africa",-33.92,18.42,4],["Nigeria",6.52,3.38,1.5],["Ghana",5.6,-0.19,1.5],["Senegal",14.69,-17.44,1],
 ["Egypt",30.04,31.24,1.5],["Tunisia",36.8,10.18,1.5],["Botswana",-24.65,25.91,1.5],["Madagascar",-18.88,47.51,2],
 ["United States",40.76,-73.98,10],["Canada",43.65,-79.38,6],["Mexico",19.43,-99.13,4],["Brazil",-22.95,-43.21,6],
 ["Argentina",-34.6,-58.38,4],["Chile",-33.45,-70.66,3],["Peru",-12.05,-77.04,2],["Colombia",4.71,-74.07,2],
 ["United Kingdom",51.5,-0.13,2],["France",48.86,2.29,3],["Germany",52.52,13.4,3],["Italy",41.89,12.49,3],
 ["Spain",40.42,-3.7,3],["Portugal",38.72,-9.14,1.5],["Netherlands",52.37,4.9,1],["Switzerland",46.95,7.45,1],
 ["Norway",59.91,10.75,3],["Sweden",59.33,18.07,3],["Poland",52.23,21.01,2],["Greece",37.97,23.73,2],
 ["Turkey",41.01,28.98,4],["Russia",55.75,37.62,5],["Ukraine",50.45,30.52,3],["Israel",31.78,35.22,0.8],
 ["United Arab Emirates",25.2,55.27,1],["India",28.61,77.21,6],["Sri Lanka",6.93,79.85,1],["Thailand",13.75,100.5,3],
 ["Vietnam",21.03,105.85,3],["Malaysia",3.14,101.69,2],["Singapore",1.29,103.85,0.1],["Indonesia",-6.2,106.82,3],
 ["Philippines",14.6,120.98,2],["Japan",35.68,139.76,5],["South Korea",37.57,126.98,2],["Taiwan",25.03,121.56,1],
 ["Mongolia",47.92,106.92,3],["Australia",-33.86,151.21,8],["New Zealand",-41.29,174.78,3],["Iceland",64.15,-21.94,2]
];
let map, pano, sv, geocoder, marker, meMarker, meCircle, current = null;

function loadGoogle(){
  const s=document.createElement("script");
  s.src=`https://maps.googleapis.com/maps/api/js?key=${API_KEY}&loading=async&callback=initTour`;
  s.async=true; s.onerror=()=>setStatus("Could not load Maps. Check your internet.");
  document.head.appendChild(s);
}
function initTour(){
  sv = new google.maps.StreetViewService();
  geocoder = new google.maps.Geocoder();
  map = new google.maps.Map(document.getElementById("map"),{center:{lat:20,lng:0},zoom:2,streetViewControl:false,mapTypeControl:false});
  pano = new google.maps.StreetViewPanorama(document.getElementById("pano"),{
    position:{lat:-1.95,lng:30.06},pov:{heading:0,pitch:0},addressControl:true,fullscreenControl:true,motionTracking:true
  });
  map.setStreetView(pano);
  marker = new google.maps.Marker({map});
  pano.addListener("position_changed",()=>{const p=pano.getPosition(); marker.setPosition(p); map.panTo(p);});
  // Click the small map to jump anywhere
  map.addListener("click",e=>findNear(e.latLng.lat(),e.latLng.lng(),5000,"chosen spot"));
  renderList("");
}
function setStatus(t){document.getElementById("status").textContent=t;}

function findNear(lat,lng,radius,label,tries=0){
  setStatus(`Searching streets in ${label}...`);
  sv.getPanorama({location:{lat,lng},radius,source:google.maps.StreetViewSource.OUTDOOR,preference:google.maps.StreetViewPreference.NEAREST},(data,status)=>{
    if(status==="OK"){
      pano.setPano(data.location.pano);
      pano.setPov({heading:Math.random()*360,pitch:0});
      map.setZoom(Math.max(map.getZoom(),12));
      setStatus(` ${label}: ${data.location.description||"street view"} — drag to look 360°, click arrows to walk.`);
    } else if(tries<6 && current){
      randomInCountry(tries+1);
    } else {
      setStatus(`No street view found near ${label}. Try another spot.`);
    }
  });
}
// Try progressively larger radii around an exact point (used by "Me" and place search)
function findNearProgressive(lat,lng,label,radii=[30,100,300,1000,5000,20000],i=0,onFail){
  if(i===0) setStatus(`Searching streets at ${label}...`);
  if(i>=radii.length){
    setStatus(`No street view coverage near ${label}. Showing it on the map only.`);
    if(onFail) onFail();
    return;
  }
  sv.getPanorama({location:{lat,lng},radius:radii[i],source:google.maps.StreetViewSource.OUTDOOR,preference:google.maps.StreetViewPreference.NEAREST},(data,status)=>{
    if(status==="OK"){
      pano.setPano(data.location.pano);
      pano.setPov({heading:0,pitch:0});
      const d=distMeters(lat,lng,data.location.latLng.lat(),data.location.latLng.lng());
      setStatus(`${label}: nearest street view is about ${Math.round(d)} m away — drag to look 360°, click arrows to walk.`);
    } else findNearProgressive(lat,lng,label,radii,i+1,onFail);
  });
}
function distMeters(a,b,c,d){
  const R=6371000,rad=x=>x*Math.PI/180,dLat=rad(c-a),dLng=rad(d-b);
  const h=Math.sin(dLat/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function randomInCountry(tries=0){
  const [name,lat,lng,spread]=current;
  const rl = tries<2 ? lat+(Math.random()-.5)*spread : lat; // fall back to capital
  const rg = tries<2 ? lng+(Math.random()-.5)*spread : lng;
  findNear(rl,rg,tries<2?20000:50000,name,tries);
}
function selectCountry(c){
  current=c;
  document.querySelectorAll(".country").forEach(el=>el.classList.toggle("active",el.dataset.name===c[0]));
  map.setCenter({lat:c[1],lng:c[2]}); map.setZoom(6);
  findNear(c[1],c[2],50000,c[0]);
}
function renderList(q){
  const list=document.getElementById("list"); list.innerHTML="";
  COUNTRIES.filter(c=>c[0].toLowerCase().includes(q.toLowerCase())).forEach(c=>{
    const d=document.createElement("div"); d.className="country"; d.dataset.name=c[0];
    d.textContent=c[0]; d.onclick=()=>selectCountry(c); list.appendChild(d);
  });
}

// ========= PLACE SEARCH (villages, cells, sectors, streets) =========
function searchPlace(){
  const q=document.getElementById("search").value.trim();
  const box=document.getElementById("placeBox");
  if(!geocoder){return;}
  if(!q){box.innerHTML="";setStatus("Type a country");return;}
  setStatus(`Searching country for "${q}"...`);
  geocoder.geocode({address:q},(results,status)=>{
    box.innerHTML="";
    if(status!=="OK"||!results.length){
      setStatus(status==="ZERO_RESULTS"?`No place found for "${q}". Try again".`:`try again
      (${status}). `);
      return;
    }
    const h=document.createElement("h4"); h.textContent="Places found"; box.appendChild(h);
    results.slice(0,6).forEach(r=>{
      const d=document.createElement("div"); d.className="place"; d.textContent=r.formatted_address;
      d.onclick=()=>goToPlace(r); box.appendChild(d);
    });
    setStatus(`Found ${Math.min(results.length,6)} place(s). Opening the best match...`);
    goToPlace(results[0]);
  });
}
function goToPlace(r){
  current=null;
  document.querySelectorAll(".country").forEach(el=>el.classList.remove("active"));
  const loc=r.geometry.location, lat=loc.lat(), lng=loc.lng();
  if(r.geometry.viewport) map.fitBounds(r.geometry.viewport); else {map.setCenter(loc);map.setZoom(15);}
  findNearProgressive(lat,lng,r.formatted_address);
}

// ========= "ME" BUTTON: exact user location =========
function showMe(){
  if(!sv) return;
  if(!navigator.geolocation){setStatus("Your browser does not support location.");return;}
  setStatus("Getting your exact location... please allow location access.");
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude, lng=pos.coords.longitude, acc=pos.coords.accuracy;
    const here={lat,lng};
    current=null;
    document.querySelectorAll(".country").forEach(el=>el.classList.remove("active"));
    if(meMarker) meMarker.setMap(null);
    if(meCircle) meCircle.setMap(null);
    meMarker=new google.maps.Marker({map,position:here,title:"You are here",zIndex:999,
      icon:{path:google.maps.SymbolPath.CIRCLE,scale:9,fillColor:"#1a73e8",fillOpacity:1,strokeColor:"#fff",strokeWeight:3}});
    meCircle=new google.maps.Circle({map,center:here,radius:acc,fillColor:"#1a73e8",fillOpacity:.15,strokeColor:"#1a73e8",strokeOpacity:.4,strokeWeight:1});
    map.setCenter(here); map.setZoom(17);
    const label=`Your location (±${Math.round(acc)} m)`;
    findNearProgressive(lat,lng,label,undefined,0,()=>{});
    // also show address if available
    geocoder.geocode({location:here},(res,st)=>{
      if(st==="OK"&&res[0]) document.getElementById("status").textContent+=` • ${res[0].formatted_address}`;
    });
  },err=>{
    const msg={1:"Location permission denied. Allow location access in your browser settings.",2:"Your position is unavailable. Check GPS/internet.",3:"Location request timed out. Try again."}[err.code]||"Could not get your location.";
    setStatus(msg+" (Note: location only works on https:// or localhost.)");
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}

document.getElementById("search").oninput=e=>renderList(e.target.value);
document.getElementById("search").onkeydown=e=>{ if(e.key==="Enter") searchPlace(); };
document.getElementById("goBtn").onclick=searchPlace;
document.getElementById("meBtn").onclick=showMe;
document.getElementById("randomBtn").onclick=()=>{ if(!sv) return; selectCountry(COUNTRIES[Math.floor(Math.random()*COUNTRIES.length)]); };
document.getElementById("nextBtn").onclick=()=>{ if(!sv) return; current?randomInCountry():setStatus("Pick a country first."); };
loadGoogle();
</script>
</body>
</html>
