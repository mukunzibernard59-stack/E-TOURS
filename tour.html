<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-tour | Explore the world in 360°</title>
    <link rel="shortcut icon" href="logo2.jpg" type="image/x-icon">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;height:100vh;display:flex;flex-direction:column}
  #header{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:1px solid #fff;gap:12px;flex-wrap:wrap}
  #websiteName{color:rgb(0,14,173);font-weight:800;font-size:clamp(1.6rem,4vw,2.6rem);text-decoration:none}
  #controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  select,input,button{padding:10px 12px;border-radius:5px;border:1px solid #fff;background:#111;color:#fff;font-weight:700}
  button{background:rgb(49,49,238);cursor:pointer}
  button.ghost{background:transparent}
  button:hover{opacity:.85}
  #main{flex:1;display:flex;min-height:0}
  #sidebar{width:260px;border-right:1px solid #fff;overflow-y:auto;padding:10px}
  #sidebar h3{margin:6px 0 10px;border-left:3px solid rgb(112,0,0);padding-left:8px}
  #search{width:100%;margin-bottom:8px}
  .country{padding:8px;border-radius:5px;cursor:pointer;font-size:14px}
  .country:hover,.country.active{background:rgba(128,128,128,.6)}
  #views{flex:1;display:flex;flex-direction:column;min-width:0}
  #pano{flex:3;min-height:0}
  #map{flex:1;min-height:150px;border-top:1px solid #fff}
  #status{padding:6px 12px;font-size:13px;color:#ccc;border-top:1px solid #333}
  @media(max-width:768px){#main{flex-direction:column}#sidebar{width:100%;height:160px;border-right:none;border-bottom:1px solid #fff}}
</style>
</head>
<body>
<div id="header">
  <a id="websiteName" href="menu.html">E-TOUR</a>
  <div id="controls">
    <button id="randomBtn"> Random place</button>
    <button id="nextBtn" class="ghost">Next spot in country ➜</button>
  </div>
</div>

<div id="main">
  <div id="sidebar">
    <h3>Countries</h3>
    <input id="search" placeholder="Search a country...">
    <div id="list"></div>
  </div>
  <div id="views">
    <div id="pano"></div>
    <div id="map"></div>
    <div id="status">Pick a country to start your 360° tour. Drag to look around, click arrows to walk.</div>
  </div>
</div>

<script>
// ========= PUT YOUR GOOGLE MAPS API KEY HERE =========
// Enable "Maps JavaScript API" in Google Cloud Console for this key.
const API_KEY = "AIzaSyAVsM1TDf3uVt-DqI_dztH007X1DZJtW3E";
// =====================================================

// Countries with Street View coverage: [name, lat, lng, spread in degrees]
const COUNTRIES = [
 ["Rwanda",-1.95,30.06,0.6],["Kenya",-1.29,36.82,2],["Uganda",0.35,32.58,1],["Tanzania",-6.8,39.28,2],
 ["South Africa",-33.92,18.42,4],["Nigeria",6.52,3.38,1.5],["Ghana",5.6,-0.19,1.5],["Senegal",14.69,-17.44,1],
 ["Egypt",30.04,31.24,1.5],["Tunisia",36.8,10.18,1.5],["Botswana",-24.65,25.91,1.5],["Madagascar",-18.88,47.51,2],
 ["United States",40.76,-73.98,10],["Canada",43.65,-79.38,6],["Mexico",19.43,-99.13,4],["Brazil",-22.95,-43.21,6],
 ["Argentina",-34.6,-58.38,4],["Chile",-33.45,-70.66,3],["Peru",-12.05,-77.04,2],["Colombia",4.71,-74.07,2],
 ["United Kingdom",51.5,-0.13,2],["France",48.86,2.29,3],["Germany",52.52,13.4,3],["Italy",41.89,12.49,3],
 ["Spain",40.42,-3.7,3],["Portugal",38.72,-9.14,1.5],["Netherlands",52.37,4.9,1],["Switzerland",46.95,7.45,1],
 ["Norway",59.91,10.75,3],["Sweden",59.33,18.07,3],["Poland",52.23,21.01,2],["Greece",37.97,23.73,2],
 ["Turkey",41.01,28.98,4],["Russia",55.75,37.62,5],["Ukraine",50.45,30.52,3],["Israel",31.78,35.22,0.8],
 ["United Arab Emirates",25.2,55.27,1],["India",28.61,77.21,6],["Sri Lanka",6.93,79.85,1],["Thailand",13.75,100.5,3],
 ["Vietnam",21.03,105.85,3],["Malaysia",3.14,101.69,2],["Singapore",1.29,103.85,0.1],["Indonesia",-6.2,106.82,3],
 ["Philippines",14.6,120.98,2],["Japan",35.68,139.76,5],["South Korea",37.57,126.98,2],["Taiwan",25.03,121.56,1],
 ["Mongolia",47.92,106.92,3],["Australia",-33.86,151.21,8],["New Zealand",-41.29,174.78,3],["Iceland",64.15,-21.94,2]
];

let map, pano, sv, marker, current = null;

function loadGoogle(){
  const s=document.createElement("script");
  s.src=`https://maps.googleapis.com/maps/api/js?key=${API_KEY}&loading=async&callback=initTour`;
  s.async=true; s.onerror=()=>setStatus("Could not load Google Maps. Check your API key.");
  document.head.appendChild(s);
}

function initTour(){
  sv = new google.maps.StreetViewService();
  map = new google.maps.Map(document.getElementById("map"),{center:{lat:20,lng:0},zoom:2,streetViewControl:false,mapTypeControl:false});
  pano = new google.maps.StreetViewPanorama(document.getElementById("pano"),{
    position:{lat:-1.95,lng:30.06},pov:{heading:0,pitch:0},addressControl:true,fullscreenControl:true,motionTracking:true
  });
  map.setStreetView(pano);
  marker = new google.maps.Marker({map});
  pano.addListener("position_changed",()=>{const p=pano.getPosition(); marker.setPosition(p); map.panTo(p);});
  // Click the small map to jump anywhere
  map.addListener("click",e=>findNear(e.latLng.lat(),e.latLng.lng(),5000,"chosen spot"));
  renderList("");
}

function setStatus(t){document.getElementById("status").textContent=t;}

function findNear(lat,lng,radius,label,tries=0){
  setStatus(`Searching streets in ${label}...`);
  sv.getPanorama({location:{lat,lng},radius,source:google.maps.StreetViewSource.OUTDOOR,preference:google.maps.StreetViewPreference.NEAREST},(data,status)=>{
    if(status==="OK"){
      pano.setPano(data.location.pano);
      pano.setPov({heading:Math.random()*360,pitch:0});
      map.setZoom(Math.max(map.getZoom(),12));
      setStatus(`📍 ${label}: ${data.location.description||"street view"} — drag to look 360°, click arrows to walk.`);
    } else if(tries<6 && current){
      randomInCountry(tries+1);
    } else {
      setStatus(`No street view found near ${label}. Try another spot.`);
    }
  });
}

function randomInCountry(tries=0){
  const [name,lat,lng,spread]=current;
  const rl = tries<2 ? lat+(Math.random()-.5)*spread : lat; // fall back to capital
  const rg = tries<2 ? lng+(Math.random()-.5)*spread : lng;
  findNear(rl,rg,tries<2?20000:50000,name,tries);
}

function selectCountry(c){
  current=c;
  document.querySelectorAll(".country").forEach(el=>el.classList.toggle("active",el.dataset.name===c[0]));
  map.setCenter({lat:c[1],lng:c[2]}); map.setZoom(6);
  findNear(c[1],c[2],50000,c[0]);
}

function renderList(q){
  const list=document.getElementById("list"); list.innerHTML="";
  COUNTRIES.filter(c=>c[0].toLowerCase().includes(q.toLowerCase())).forEach(c=>{
    const d=document.createElement("div"); d.className="country"; d.dataset.name=c[0];
    d.textContent=c[0]; d.onclick=()=>selectCountry(c); list.appendChild(d);
  });
}

document.getElementById("search").oninput=e=>renderList(e.target.value);
document.getElementById("randomBtn").onclick=()=>{ if(!sv) return; selectCountry(COUNTRIES[Math.floor(Math.random()*COUNTRIES.length)]); };
document.getElementById("nextBtn").onclick=()=>{ if(!sv) return; current?randomInCountry():setStatus("Pick a country first."); };

loadGoogle();
</script>
</body>
</html>
